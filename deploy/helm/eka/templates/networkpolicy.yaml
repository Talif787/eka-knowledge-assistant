{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eka.fullname" . }}
  labels:
    {{- include "eka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "eka.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres and Redis (in-cluster or external)
    - ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
{{- end }}
