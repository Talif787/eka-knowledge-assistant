services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eka
      POSTGRES_PASSWORD: eka
      POSTGRES_DB: eka
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eka"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      EKA_ENVIRONMENT: development
      EKA_DATABASE_DSN: postgresql+asyncpg://eka:eka@db:5432/eka
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn eka.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      EKA_ENVIRONMENT: development
      EKA_DATABASE_DSN: postgresql+asyncpg://eka:eka@db:5432/eka
      EKA_WORKER_ID: worker-compose-1
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "eka.worker"]
